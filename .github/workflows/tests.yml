name: tests

on:
  push:
    branches: [main, "vibe/*"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Verify migrations apply on a fresh database
        run: |
          rm -f ci.db
          DATABASE_URL="sqlite:///./ci.db" alembic upgrade head
          DATABASE_URL="sqlite:///./ci.db" python -m app.seed
          rm -f ci.db
