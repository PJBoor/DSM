services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: holistic
      POSTGRES_PASSWORD: holistic
      POSTGRES_DB: holistic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holistic"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://holistic:holistic@db:5432/holistic
      SECRET_KEY: change-me-in-production-0123456789abcdef
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
